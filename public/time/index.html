<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Time · Balão da Informática</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* ------------------------------------------------------------------
     Sala de controle do time digital.

     A tela é de jogo, os números não são. Cada barra, cada luz e cada
     linha do diário sai de um endpoint real da VPS — e quando o endpoint
     não responde, a carta diz "sem contato" em vez de inventar
     movimento. Painel que anima sozinho é bonito uma vez e mentiroso
     todo dia depois.
     ------------------------------------------------------------------ */
  :root {
    --fundo: #070b14;
    --carta: #0f1626;
    --carta-borda: #1e2a42;
    --texto: #e8eefc;
    --apagado: #7f8da8;
    --vermelho: #E60012;
    --verde: #22c55e;
    --ambar: #f59e0b;
    --azul: #38bdf8;
    --roxo: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(230,0,18,.18), transparent 60%),
      var(--fundo);
    color: var(--texto);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .envelope { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; }

  header.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.02em; font-weight: 800; }
  h1 span { color: var(--vermelho); }
  .subtitulo { margin: 6px 0 0; color: var(--apagado); font-size: 14px; }

  .linhas { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 26px; }
  .linha {
    display: flex; align-items: center; gap: 9px;
    background: var(--carta); border: 1px solid var(--carta-borda);
    border-radius: 999px; padding: 8px 15px; font-size: 13px;
  }
  .linha b { font-variant-numeric: tabular-nums; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: var(--apagado); flex: none; }
  .led.on { background: var(--verde); box-shadow: 0 0 0 4px rgba(34,197,94,.16); animation: pulsa 2.4s ease-in-out infinite; }
  .led.off { background: var(--vermelho); box-shadow: 0 0 0 4px rgba(230,0,18,.16); }
  @keyframes pulsa { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  .grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }

  .personagem {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--carta), #0b1220);
    border: 1px solid var(--carta-borda); border-radius: 18px; padding: 18px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .personagem:hover { transform: translateY(-3px); border-color: #2d3d5e; }
  .personagem.trabalhando { border-color: rgba(34,197,94,.42); }
  .personagem.trabalhando::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(340px 140px at 50% 0%, rgba(34,197,94,.12), transparent 70%);
  }
  .personagem.sem-contato { opacity: .62; }

  .cabeca { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .retrato {
    width: 52px; height: 52px; flex: none; border-radius: 15px;
    display: grid; place-items: center; font-size: 26px;
    background: #17203a; border: 1px solid var(--carta-borda);
  }
  .nome { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .classe { color: var(--apagado); font-size: 12.5px; }

  .selo {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  .selo.ligado { background: rgba(34,197,94,.14); color: #86efac; }
  .selo.parado { background: rgba(245,158,11,.14); color: #fcd34d; }
  .selo.mudo   { background: rgba(127,141,168,.14); color: var(--apagado); }

  .fala { min-height: 42px; margin: 0 0 14px; font-size: 13.5px; color: #c3cee4; }

  .barra-rotulo { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--apagado); margin-bottom: 5px; }
  .barra { height: 8px; border-radius: 99px; background: #18223a; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

  .numeros { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .numeros div { font-size: 11.5px; color: var(--apagado); }
  .numeros b { display: block; font-size: 17px; color: var(--texto); font-variant-numeric: tabular-nums; }

  .diario { margin-top: 30px; background: var(--carta); border: 1px solid var(--carta-borda); border-radius: 18px; padding: 18px; }
  .diario h2 { margin: 0 0 14px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--apagado); }
  .diario ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .diario li { display: flex; gap: 11px; align-items: baseline; font-size: 13.5px; }
  .diario .quando { color: var(--apagado); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; min-width: 48px; }
  .diario .vazio { color: var(--apagado); font-size: 13.5px; }

  footer { margin-top: 26px; color: var(--apagado); font-size: 12px; text-align: center; }
  footer a { color: var(--apagado); }

  @media (max-width: 520px) { .envelope { padding: 20px 14px 40px; } }
</style>
</head>
<body>
<div class="envelope">

  <header class="topo">
    <div>
      <h1>O <span>Time</span></h1>
      <p class="subtitulo">Os funcionários digitais da Balão, ao vivo. Atualiza sozinho a cada 15 segundos.</p>
    </div>
    <div class="linha"><span class="led" id="pulso"></span><span id="relogio">—</span></div>
  </header>

  <div class="linhas" id="linhas"></div>

  <div class="grade" id="grade"></div>

  <section class="diario">
    <h2>Diário de bordo</h2>
    <ul id="diario"><li class="vazio">Lendo o estado de cada um…</li></ul>
  </section>

  <footer>
    Tudo nesta tela vem dos servidores de verdade. Nada aqui é simulado —
    quando um deles não responde, a carta diz “sem contato”.
    <br><a href="/central">← voltar para a Central</a>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var VPS = "https://srv1963897.hstgr.cloud";
  var LOJA = VPS;          // número da loja: Júlia e Carla
  var FORA = VPS + "/beto"; // número de fora: Beto e Rafa

  // Buscar sem deixar uma falha derrubar a tela: quem não responde volta
  // null e a carta correspondente entra em "sem contato".
  function pegar(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  function hora(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d)) return null;
    return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function escapar(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function barra(feito, teto, cor) {
    if (!teto) return "";
    var pct = Math.max(0, Math.min(100, Math.round((feito / teto) * 100)));
    return '<div class="barra-rotulo"><span>hoje</span><span>' + feito + " / " + teto + "</span></div>" +
           '<div class="barra"><i style="width:' + pct + "%;background:" + cor + '"></i></div>';
  }

  function carta(p) {
    var classe = "personagem" + (p.semContato ? " sem-contato" : (p.ligado ? " trabalhando" : ""));
    var selo = p.semContato
      ? '<span class="selo mudo">sem contato</span>'
      : p.ligado
        ? '<span class="selo ligado">● em serviço</span>'
        : '<span class="selo parado">em espera</span>';

    var numeros = (p.numeros || []).map(function (n) {
      return "<div><b>" + escapar(n.valor) + "</b>" + escapar(n.rotulo) + "</div>";
    }).join("");

    return '<article class="' + classe + '">' +
      '<div class="cabeca">' +
        '<div class="retrato">' + p.retrato + "</div>" +
        "<div><div class=\"nome\">" + escapar(p.nome) + '</div><div class="classe">' + escapar(p.classe) + "</div></div>" +
      "</div>" +
      selo +
      '<p class="fala">' + escapar(p.fala) + "</p>" +
      (p.teto ? barra(p.feito || 0, p.teto, p.cor) : "") +
      (numeros ? '<div class="numeros">' + numeros + "</div>" : "") +
    "</article>";
  }

  function desenhar(d) {
    var diario = [];
    function anotar(quem, texto, quando) {
      if (texto) diario.push({ quem: quem, texto: texto, quando: quando });
    }

    /* ---------- linhas de WhatsApp ---------- */
    var linhas = [
      {
        rotulo: "Linha da loja",
        ok: d.statusLoja && d.statusLoja.connected,
        numero: d.statusLoja && d.statusLoja.phoneNumber,
        estado: d.statusLoja && d.statusLoja.estado
      },
      {
        rotulo: "Linha de fora",
        ok: d.statusFora && d.statusFora.connected,
        numero: d.statusFora && d.statusFora.phoneNumber,
        estado: d.statusFora && d.statusFora.estado
      }
    ];
    document.getElementById("linhas").innerHTML = linhas.map(function (l) {
      var detalhe = l.numero ? "<b>" + escapar(l.numero) + "</b>" : escapar(l.estado || "sem resposta");
      return '<div class="linha"><span class="led ' + (l.ok ? "on" : "off") + '"></span>' +
             escapar(l.rotulo) + " · " + detalhe + "</div>";
    }).join("");

    /* ---------- personagens ---------- */
    var personagens = [];

    // Júlia — atendimento
    var ia = d.julia && d.julia.ia;
    if (!ia) {
      personagens.push({ nome: "Júlia", classe: "Vendedora", retrato: "💬", semContato: true,
        fala: "Sem contato com o servidor da loja." });
    } else {
      var modo = ia.modo === "autopilot" ? "autopiloto" : ia.modo === "copilot" ? "copiloto" : "desligada";
      var ligada = ia.modo && ia.modo !== "off";
      personagens.push({
        nome: "Júlia", classe: "Vendedora · linha da loja", retrato: "💬",
        ligado: ligada, cor: "var(--azul)",
        fala: ligada
          ? "Atendendo em " + modo + "." + (ia.processando ? " Respondendo " + ia.processando + " conversa(s) agora." : "")
          : "Desligada. Nenhuma resposta sai sem alguém ligar o copiloto.",
        numeros: [
          { valor: (ia.stats && ia.stats.respostas) || 0, rotulo: "respostas" },
          { valor: (ia.stats && ia.stats.sugestoes) || 0, rotulo: "sugestões" },
          { valor: (ia.stats && ia.stats.falhas) || 0, rotulo: "falhas" }
        ]
      });
      anotar("Júlia", ia.ultimaAcao, null);
    }

    // Beto — prospecção
    if (!d.beto) {
      personagens.push({ nome: "Beto", classe: "Prospector", retrato: "🎯", semContato: true,
        fala: "Sem contato com o número de fora." });
    } else {
      personagens.push({
        nome: "Beto", classe: "Prospector · linha de fora", retrato: "🎯",
        ligado: !!d.beto.ativo, cor: "var(--ambar)",
        feito: d.beto.enviadosHoje || 0, teto: d.beto.maxDia || 0,
        fala: d.beto.ativo
          ? (d.beto.horarioComercial ? "Em campo, dentro do horário comercial." : "Ligado, mas fora do horário — não dispara agora.")
          : "Desligado. A base está pronta, esperando você mandar ir.",
        numeros: [
          { valor: d.beto.maxDia || 0, rotulo: "teto do dia" },
          { valor: d.beto.horarioComercial ? "sim" : "não", rotulo: "no horário" }
        ]
      });
      anotar("Beto", d.beto.ultimaAcao, null);
    }

    // Carla — cobrança
    if (!d.carla) {
      personagens.push({ nome: "Carla", classe: "Cobradora", retrato: "📞", semContato: true,
        fala: "Sem contato com o servidor da loja." });
    } else {
      personagens.push({
        nome: "Carla", classe: "Cobrança & reativação · linha da loja", retrato: "📞",
        ligado: !!d.carla.ativo, cor: "var(--roxo)",
        feito: d.carla.enviadosHoje || 0, teto: d.carla.maxDia || 0,
        fala: d.carla.ativo
          ? (d.carla.horarioComercial ? "Cobrando quem já venceu, com cuidado." : "Ligada, mas fora do horário.")
          : "Desligada. Só cobra o que já venceu, e uma vez por pessoa.",
        numeros: [
          { valor: d.carla.maxDia || 0, rotulo: "teto do dia" },
          { valor: d.carla.tokenConfigurado ? "sim" : "não", rotulo: "fala com o site" }
        ]
      });
      anotar("Carla", d.carla.ultimaAcao, null);
    }

    // Rafa — inteligência
    if (!d.rafa) {
      personagens.push({ nome: "Rafa", classe: "Analista", retrato: "📊", semContato: true,
        fala: "Sem contato com o número de fora." });
    } else {
      var falta = [];
      if (!d.rafa.destinoConfigurado) falta.push("o número de destino");
      if (!d.rafa.tokenConfigurado) falta.push("o token do site");
      personagens.push({
        nome: "Rafa", classe: "Analista · linha de fora", retrato: "📊",
        ligado: !!d.rafa.ativo, cor: "var(--verde)",
        fala: falta.length
          ? "Falta configurar " + falta.join(" e ") + "."
          : d.rafa.ativo
            ? "De plantão. Manda às " + d.rafa.horaManha + "h e às " + d.rafa.horaNoite + "h."
            : "Desligado. Pronto para o briefing das " + d.rafa.horaManha + "h.",
        numeros: [
          { valor: d.rafa.horaManha + "h", rotulo: "o setor" },
          { valor: d.rafa.horaNoite + "h", rotulo: "o fechamento" },
          { valor: d.rafa.agoraNaLoja ? d.rafa.agoraNaLoja.slice(-3) : "—", rotulo: "na loja" }
        ]
      });
      anotar("Rafa", d.rafa.ultimaAcao, null);
      if (d.rafa.ultimoEnvio) {
        if (d.rafa.ultimoEnvio.manha) anotar("Rafa", "briefing do setor enviado", d.rafa.ultimoEnvio.manha);
        if (d.rafa.ultimoEnvio.noite) anotar("Rafa", "fechamento do dia enviado", d.rafa.ultimoEnvio.noite);
      }
      if (d.rafa.ultimoErro) anotar("Rafa", "erro: " + d.rafa.ultimoErro, null);
    }

    document.getElementById("grade").innerHTML = personagens.map(carta).join("");

    /* ---------- diário ---------- */
    var lista = document.getElementById("diario");
    if (!diario.length) {
      lista.innerHTML = '<li class="vazio">Ninguém registrou ação ainda hoje. Quando algum deles trabalhar, aparece aqui.</li>';
    } else {
      lista.innerHTML = diario.map(function (l) {
        var quando = hora(l.quando) || (l.quando || "—");
        return '<li><span class="quando">' + escapar(quando) + "</span><span><b>" +
               escapar(l.quem) + "</b> · " + escapar(l.texto) + "</span></li>";
      }).join("");
    }

    document.getElementById("relogio").textContent =
      "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function atualizar() {
    var pulso = document.getElementById("pulso");
    pulso.className = "led on";

    Promise.all([
      pegar(LOJA + "/api/status"),
      pegar(FORA + "/api/status"),
      pegar(LOJA + "/api/crm/ia/estado"),
      pegar(LOJA + "/api/crm/carla/estado"),
      pegar(FORA + "/api/crm/beto/estado"),
      pegar(FORA + "/api/crm/rafa/estado")
    ]).then(function (r) {
      desenhar({
        statusLoja: r[0], statusFora: r[1],
        julia: r[2], carla: r[3], beto: r[4], rafa: r[5]
      });
    });
  }

  atualizar();
  setInterval(atualizar, 15000);
  // Voltar para a aba não deve esperar 15 segundos para mostrar a verdade.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) atualizar();
  });
})();
</script>
</body>
</html>
