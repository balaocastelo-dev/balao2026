# WhatsApp da loja: Evolution API + banco + cache + servidor do painel.
#
# Sobe com o deploy-evo.sh (que gera as senhas na primeira vez). Nada aqui
# fica exposto para a internet além do servidor do painel, e mesmo ele só
# escuta em 127.0.0.1 — o Caddy da VPS é quem publica com HTTPS.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?gere com o deploy-evo.sh}
      POSTGRES_DB: evolution
    volumes:
      - ${DADOS}/postgres:/var/lib/postgresql/data
    # Memória. A VPS é a KVM 2 da Hostinger (2 vCPU, 8 GB) — confira com
    # `free -h` antes do deploy (o deploy-evo.sh mostra e avisa se tiver menos
    # de 4 GB). Somando os tetos: Postgres 1 GB + Evolution 1,5 GB + servidor
    # 768 MB + Redis 256 MB = ~3,5 GB, folga de sobra em 8 GB.
    #
    # Com 512 MB e os padrões do Postgres (shared_buffers de 128 MB, work_mem
    # de 4 MB), a tabela "Message" inteira não cabia no cache e o findChats
    # ordenava em disco ("external merge"). Os números abaixo seguem a regra
    # de bolso: shared_buffers ~25% do teto, effective_cache_size ~75%.
    #
    # plan_cache_mode=force_custom_plan: medido na Evolution 2.3.7 de verdade
    # (bancada local, 200 mil mensagens falsas, log do auto_explain). O Prisma
    # usa comandos preparados e manda o caminho JSON como PARÂMETRO
    # ("key"#>ARRAY[$2]). Depois de 5 execuções o Postgres passa a usar um
    # plano genérico, em que $2 é desconhecido — e aí NENHUM índice casa: o
    # count(*) do findMessages voltava a ler a tabela inteira (115–195 ms)
    # mesmo com balao_msg_jidjson_ts criado. Forçando o plano de cada
    # execução, o índice vale sempre; o custo é planejar de novo cada
    # consulta (frações de milissegundo).
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - plan_cache_mode=force_custom_plan
    mem_limit: 1g
    # O /dev/shm padrão do Docker é 64 MB; consulta paralela do Postgres usa
    # memória compartilhada de lá e falha ("could not resize shared memory
    # segment") quando ela acaba.
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DADOS}/redis:/data
    mem_limit: 256m

  evolution:
    # A imagem oficial evoapicloud/evolution-api:v2.3.7 com UMA linha trocada
    # no Baileys: a fila offline que travava o recebimento (apagão de 29/09).
    # Ver evolution/Dockerfile e evolution/remendar-baileys.cjs. O build falha
    # se o remendo não encaixar — e aí a Evolution antiga continua no ar.
    build:
      context: ./evolution
    image: balao-evolution:2.3.7-remendo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      SERVER_DISABLE_MANAGER: "true"
      SERVER_DISABLE_DOCS: "true"
      # A Evolution só é alcançável pela rede interna do Docker; com uma origem
      # específica aqui ela recusa até as chamadas do próprio servidor.
      CORS_ORIGIN: "*"
      AUTHENTICATION_API_KEY: ${EVOLUTION_CHAVE:?gere com o deploy-evo.sh}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_balao
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Balao CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      WEBSOCKET_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      TZ: America/Sao_Paulo
    volumes:
      - ${DADOS}/evolution:/evolution/instances
    mem_limit: 1536m

  balao-whats:
    build:
      context: .
      dockerfile: Dockerfile.evo
      args:
        VERSAO: ${VERSAO:-dev}
    image: balao-whats-evo
    restart: unless-stopped
    depends_on:
      evolution:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATA_ROOT: /dados
      # Banco próprio do módulo de Status, no mesmo Postgres (banco "balao").
      STATUS_DB_URL: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/balao
      STATUS_DB_URL_ADMIN: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution
      URL_INTERNA_SERVIDOR: http://balao-whats:4100
      PORT: "4100"
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_CHAVE}
      EVOLUTION_INSTANCIA: loja
      EVOLUTION_INSTANCIA_TESTE: fora
      WEBHOOK_URL_INTERNA: http://balao-whats:4100/evolution/webhook
      SITE_URL: https://www.balao.info
      WHATSAPP_PANEL_ALLOWED_ORIGIN: ${ORIGENS:-https://www.balao.info,https://balao.info}
      TZ: America/Sao_Paulo
      # Vigia de recebimento. Em 29/09 o WhatsApp ficou dois dias sem receber
      # nada, com tudo dizendo "conectado", porque enviar continuava
      # funcionando. Basta uma linha em segredos.env para o alarme sair do
      # painel e chegar ao celular:
      #
      #   VIGIA_AVISAR_WHATSAPP=55319XXXXXXXX
      #
      # O resto tem padrão razoável (claude/vigia-de-recebimento.md explica).
      VIGIA_AVISAR_WHATSAPP: ${VIGIA_AVISAR_WHATSAPP:-}
      VIGIA_TELEGRAM_TOKEN: ${VIGIA_TELEGRAM_TOKEN:-}
      VIGIA_TELEGRAM_CHAT: ${VIGIA_TELEGRAM_CHAT:-}
      VIGIA_SILENCIO_MIN: ${VIGIA_SILENCIO_MIN:-45}
      VIGIA_ESCALA_MIN: ${VIGIA_ESCALA_MIN:-45}
      VIGIA_AUTOCURA: ${VIGIA_AUTOCURA:-0}
    ports:
      - "127.0.0.1:${PORTA:-4100}:4100"
    volumes:
      - ${DADOS}/painel:/dados
    mem_limit: 768m
